# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret ID requested via runtime.GetSecret(&cre.SecretRequest{Id: ...})
# to the environment variable holding its value. The Vault DON releases these
# directly into the attested enclave — never exposed in plaintext to node
# operators or Workflow DON node memory.
secretsNames:
    SUMSUB_APP_TOKEN:
        - SECRET_SUMSUB_APP_TOKEN
    SUMSUB_SECRET_KEY:
        - SECRET_SUMSUB_SECRET_KEY
